<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Processing video</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="shell progress-shell"><p class="eyebrow">SEGMENTATION</p><h1>Annotating your video</h1><p id="message">Starting the model...</p><div class="progress-track"><div id="bar" class="progress-bar"></div></div><strong id="percent">0%</strong><p class="quiet">This page updates automatically while each frame is processed.</p></main><script>
async function checkProgress() { const response = await fetch('{{ url_for("progress", job_id=job_id) }}'); const job = await response.json(); document.getElementById('bar').style.width = `${job.progress || 0}%`; document.getElementById('percent').textContent = `${job.progress || 0}%`; document.getElementById('message').textContent = job.message || ''; if (job.status === 'complete') { window.location.href = '{{ url_for("video_done", job_id=job_id) }}'; } else if (job.status === 'error') { document.getElementById('message').textContent = `Processing failed: ${job.message}`; } else { setTimeout(checkProgress, 800); } } checkProgress();
</script></body></html>
